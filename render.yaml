# yaml-language-server: $schema=https://raw.githubusercontent.com/renderinc/render-blueprint-schema/main/render.yaml.json

services:
  - type: web
    name: brightuwem39-lumi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    dockerCommand: /app/render-start.sh
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: API_DOCS_ENABLED
        value: "false"
      - key: AUTH_DEV_TOKENS_ENABLED
        value: "false"
      - key: VERIFICATION_TTL_MINUTES
        value: "10"
      - key: EMAIL_ENABLED
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Lumi
      - key: PUBLIC_APP_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_ENABLED
        value: "false"
      - key: PAYSTACK_MODE
        value: test
      - key: PAYSTACK_ALLOWED_CURRENCIES
        value: NGN
      - key: PAYMENT_RECONCILIATION_INTERVAL_SECONDS
        value: "60"
      - key: PAYMENT_RECONCILIATION_BATCH_SIZE
        value: "25"
