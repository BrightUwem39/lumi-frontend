name: lumi-production

services:
  migrate:
    build:
      context: ./backend
      target: migrate
    env_file: ${LUMI_ENV_FILE:-./deploy/production.env}
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    env_file: ${LUMI_ENV_FILE:-./deploy/production.env}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    init: true
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
