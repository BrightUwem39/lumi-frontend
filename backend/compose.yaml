services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi_local_password
    ports:
      # Port 5432 is already used by a Windows PostgreSQL service on this machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - lumi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumi_postgres_data:
